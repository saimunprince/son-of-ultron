<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYRAX</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="link.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* no CSS 3D tilt: it resampled the whole canvas every frame and softened every line */
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  /* command bar: the one piece of DOM, so the operator can type to the AI */
  #bar { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(760px, 80vw); display: flex; align-items: center; gap: 12px;
         padding: 10px 16px; background: rgba(6,12,20,.55); border: 1px solid rgba(120,200,255,.25); backdrop-filter: blur(10px);
         box-shadow: 0 0 24px rgba(60,160,255,.15), inset 0 0 18px rgba(60,160,255,.06); font: 16px "Share Tech Mono", monospace; color: #dbeeff;
         clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
         transition: border-color .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s cubic-bezier(.2,.8,.2,1); }
  #bar:focus-within { border-color: rgba(140,215,255,.5); box-shadow: 0 0 28px rgba(60,160,255,.2), inset 0 0 22px rgba(60,160,255,.08); }
  #bar.thinking { border-color: rgba(255,120,80,.6); box-shadow: 0 0 30px rgba(255,90,60,.25); }
  #bar.responding { border-color: rgba(255,110,80,.45); box-shadow: 0 0 26px rgba(255,90,60,.18); }
  #bar.listening { border-color: rgba(120,255,200,.6); box-shadow: 0 0 30px rgba(80,255,180,.2); }
  #bar .pfx { color: rgba(255,150,90,.9); letter-spacing: .08em; white-space: nowrap; transition: color .3s, transform .3s cubic-bezier(.2,.8,.2,1); }
  #bar:focus-within .pfx { color: #ffb089; transform: translateX(2px); }
  #cmd { flex: 1; background: none; border: 0; outline: 0; color: #e8f6ff; font: inherit; letter-spacing: .04em; caret-color: #ff8a5c; }
  #cmd::placeholder { color: rgba(160,200,230,.4); }
  #cmd:focus::placeholder { color: rgba(160,200,230,.22); }
  #bar .hint { color: rgba(160,200,230,.45); font-size: 12px; white-space: nowrap; transition: color .3s; }
  #bar:has(#cmd:not(:placeholder-shown)) .hint { color: rgba(255,170,120,.85); }
  /* typing pulse: a hairline that flashes out from the center on every keystroke; a slow scan while thinking */
  #bar::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 1px; opacity: 0;
                background: linear-gradient(90deg, transparent, rgba(255,150,100,.9), transparent); pointer-events: none; }
  #bar.tick::after { animation: tick .38s ease-out; }
  #bar.thinking::after { opacity: .8; left: 14px; right: auto; width: 30%; animation: scan 1.6s cubic-bezier(.45,0,.55,1) infinite alternate; }
  @keyframes tick { from { opacity: .8; transform: scaleX(.15); } to { opacity: 0; transform: scaleX(1); } }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(calc(760px * .8 - 100%)); } }
  /* window controls + drag strip: only in the desktop shell, whose window is frameless */
  /* title strip: invisible; grab the top 40px to move the window (windowed mode only), double-click maximizes/restores */
  #drag { position: fixed; top: 0; left: 0; right: 0; height: 40px; -webkit-app-region: drag; display: none; z-index: 9; }
  #drag.on { display: block; }
  /* buttons: bare line icons in the HUD's own style, no boxes; hover lights them up */
  #wc { position: fixed; top: 9px; right: 12px; display: none; gap: 4px; z-index: 10; -webkit-app-region: no-drag; }
  #wc.on { display: flex; }
  #wc button { -webkit-app-region: no-drag; position: relative; width: 30px; height: 24px; display: grid; place-items: center;
               padding: 0; cursor: pointer; background: none; border: 0; color: rgba(150,205,240,.55);
               transition: color .2s, filter .2s; }
  #wc button::after { content: ''; position: absolute; left: 9px; right: 9px; bottom: 1px; height: 1px;
                      background: currentColor; opacity: 0; transform: scaleX(.3); transition: opacity .2s, transform .2s; }
  #wc button:hover { color: #eaf6ff; filter: drop-shadow(0 0 4px rgba(120,200,255,.9)); }
  #wc button:hover::after { opacity: .9; transform: scaleX(1); }
  #wc #wc-close:hover { color: #ff7a5c; filter: drop-shadow(0 0 5px rgba(255,80,50,.95)); }
  #wc svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.3; fill: none; }
  /* Visible Work Presence, minimal: a small always-on-top core; the shell's corner window has no room for controls */
  body.minimal #bar, body.minimal #wc, body.minimal #drag { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="drag"></div>
<div id="wc">
  <button id="wc-min" title="Minimize"><svg viewBox="0 0 14 14"><path d="M2 7.5h10"/></svg></button>
  <button id="wc-fs" title="Fullscreen (F11)"></button>
  <button id="wc-close" title="Close (Ctrl+Q)"><svg viewBox="0 0 14 14"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9"/></svg></button>
</div>
<div id="bar"><span class="pfx">›</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="type a command — or press V and speak"><span class="hint">ENTER</span></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scene = document.createElement('canvas'), gs = scene.getContext('2d');
const far = document.createElement('canvas'), gf = far.getContext('2d'); // background layer, blurred for depth of field
const bloom = document.createElement('canvas'), bc = bloom.getContext('2d');
const ui = document.createElement('canvas'), gu = ui.getContext('2d'); // text and data panels: composited last, never fringed or striped
let g = gs; // active drawing context; layers swap it
const TAU = Math.PI * 2, D = Math.PI / 180;
let W, H, DPR, U;

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(1977);
const rr = (a, b) => a + (b - a) * R();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = scene.width = far.width = ui.width = Math.round(W * DPR);
  cv.height = scene.height = far.height = ui.height = Math.round(H * DPR);
  bloom.width = Math.ceil(cv.width / 4);
  bloom.height = Math.ceil(cv.height / 4);
  U = Math.min(W, H) / 1950; // scene is authored in a 2000-unit space centered at 0,0
}
addEventListener('resize', resize);
resize();

// ---------- live state ----------
const S = {
  mx: 0, my: 0, px: 0, py: 0, nx: 0, ny: 0, tx: 0, ty: 0, mspeed: 0, // mouse: world, screen-normalized, tilt
  boost: 0, glitch: 0, scale: 1,
  fps: 60, fpsHist: new Array(120).fill(60), frameMs: 16,
  log: [], blips: [], hits: [],
  mic: false, level: 0, freq: new Uint8Array(128), wave: new Uint8Array(256), analyser: null,
  battery: null, locked: null, keys: 0, clicks: 0,
  voice: false, heard: '', reply: '', replyT: 0, speaking: 0, rec: null,
  omega: 0, drag: null, standby: 0, sound: true, ac: null,          // ring physics, focus state, audio engine
  mode: 'IDLE', ultron: 0, think: 0, pulse: 0, chat: [], cog: [], memory: [], // AI state machine, red tint, dialogue, cognition stream
  iss: null, issTrail: [], weather: null, geo: null, latency: 0, netT: 0, // live feeds
};
const ASSEMBLE = 7; // seconds for the HUD to assemble itself, one element at a time, after waking

// ---------- live feeds: ISS telemetry, local weather, own position ----------
async function fetchISS() {
  const t0 = performance.now();
  try {
    const r = await fetch('https://api.wheretheiss.at/v1/satellites/25544', { cache: 'no-store' });
    const j = await r.json();
    S.latency = performance.now() - t0; S.netT = performance.now();
    S.latHist.push(S.latency); S.latHist.shift();
    if (!S.iss) log('ISS TELEMETRY ACQUIRED');
    S.iss = j;
    S.issTrail.push([j.latitude, j.longitude]); if (S.issTrail.length > 90) S.issTrail.shift();
  } catch (e) { if (S.iss) log('ISS LINK LOST'); S.iss = null; }
}
async function fetchWeather(lat, lon) {
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,surface_pressure,cloud_cover&daily=sunrise,sunset&timezone=auto`);
    const j = await r.json();
    S.weather = j.current;
    S.sun = { rise: j.daily.sunrise[0].slice(11, 16), set: j.daily.sunset[0].slice(11, 16) };
    log(`ATMOS LINK ${S.weather.temperature_2m}°C ${S.weather.wind_speed_10m}KM/H`);
  } catch (e) { log('ATMOS LINK FAILED'); }
  try {
    const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm2_5,pm10,us_aqi,uv_index`);
    S.air = (await r.json()).current;
    log(`AIR QUALITY AQI ${S.air.us_aqi}`);
  } catch (e) { S.air = null; }
}
// USGS: every earthquake on the planet in the last hour → radar contacts + globe markers
async function fetchQuakes() {
  try {
    const r = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson', { cache: 'no-store' });
    const j = await r.json();
    const prev = S.quakes?.length || 0;
    S.quakes = j.features.filter(f => f.properties.mag != null).map(f => ({
      mag: f.properties.mag, place: (f.properties.place || 'UNKNOWN').toUpperCase(), time: f.properties.time,
      lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], depth: f.geometry.coordinates[2], id: f.id,
    })).sort((a, b) => b.mag - a.mag).slice(0, 14);
    if (!prev) log('SEISMIC FEED ' + j.features.length + ' EVENTS/HR');
    else if (S.quakes[0] && S.quakes[0].id !== S.lastQuake) log(`SEISMIC M${S.quakes[0].mag.toFixed(1)} ${S.quakes[0].place.slice(0, 22)}`);
    S.lastQuake = S.quakes[0]?.id;
  } catch (e) { log('SEISMIC FEED FAILED'); }
}
// NOAA SWPC: solar wind + geomagnetic index
// NOAA sends no CORS headers: from the core's origin the feed goes through the core (/hud/feed/<name>); from disk it is direct
const feedUrl = (name, direct) => location.protocol.startsWith('http') ? location.origin + '/hud/feed/' + name : direct;
async function fetchSolar() {
  try {
    const r = await fetch(feedUrl('solar', 'https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json'), { cache: 'no-store' });
    const rows = (await r.json()).slice(1).filter(x => x[2] != null);
    const last = rows[rows.length - 1];
    S.solar = { density: +last[1], speed: +last[2], temp: +last[3], hist: rows.slice(-120).map(x => +x[2]) };
    const k = await (await fetch(feedUrl('kp', 'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json'), { cache: 'no-store' })).json();
    S.kp = +k[k.length - 1][1];
    if (!S.solarLogged) { S.solarLogged = true; log(`SOLAR WIND ${S.solar.speed | 0} KM/S · KP ${S.kp}`); }
  } catch (e) { S.solar = null; }
}
// moon phase from the synodic month (no feed needed)
function moonPhase(d = new Date()) {
  const age = ((d - Date.UTC(2000, 0, 6, 18, 14)) / 864e5) % 29.530588853;
  const f = age / 29.530588853, illum = (1 - Math.cos(f * TAU)) / 2;
  const names = ['NEW', 'WAXING CRESCENT', 'FIRST QUARTER', 'WAXING GIBBOUS', 'FULL', 'WANING GIBBOUS', 'LAST QUARTER', 'WANING CRESCENT'];
  return { name: names[Math.round(f * 8) % 8], illum, age };
}
// event-loop lag: how late timers fire tells you how busy the machine really is
S.lag = 0; S.lagHist = new Array(128).fill(0); S.latHist = new Array(60).fill(0);
(() => { let exp = performance.now() + 50; setInterval(() => { const now = performance.now(), lag = Math.max(0, now - exp); exp = now + 50; S.lag = S.lag * .8 + lag * .2; S.lagHist.push(lag); S.lagHist.shift(); }, 50); })();
// bearing/distance from the operator to a point on the planet
function geoVec(lat, lon) {
  const o = S.geo || { lat: 23.81, lon: 90.41 };
  const φ1 = o.lat * D, φ2 = lat * D, dλ = (lon - o.lon) * D;
  const y = Math.sin(dλ) * Math.cos(φ2), x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(dλ);
  const bearing = (Math.atan2(y, x) / D + 360) % 360;
  const a = Math.sin((φ2 - φ1) / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(dλ / 2) ** 2;
  return { bearing, dist: 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) };
}
function initFeeds() {
  fetchISS(); setInterval(fetchISS, 5000);
  fetchQuakes(); setInterval(fetchQuakes, 60000);
  fetchSolar(); setInterval(fetchSolar, 300000);
  const fallback = () => { S.geo = { lat: 23.81, lon: 90.41, name: 'DHAKA (DEFAULT)' }; fetchWeather(23.81, 90.41); };
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
    p => { S.geo = { lat: p.coords.latitude, lon: p.coords.longitude, name: 'YOU', acc: p.coords.accuracy }; log(`POSITION FIX ±${p.coords.accuracy | 0}M`); fetchWeather(S.geo.lat, S.geo.lon); },
    fallback, { timeout: 8000 });
  else fallback();
  setInterval(() => S.geo && fetchWeather(S.geo.lat, S.geo.lon), 600000);
}
if (!location.search.includes('nofeed')) initFeeds(); // ?nofeed disables network feeds (headless tests)
// desktop shell: real machine telemetry from Electron's main process (absent in a plain browser)
S.sys = null; S.cpuHist = new Array(120).fill(0);
const gb = b => (b / 1073741824).toFixed(1);
const rate = b => b > 1048576 ? (b / 1048576).toFixed(1) + 'M' : ((b / 1024) | 0) + 'K';
if (window.ultronSys) {
  S.desktop = true;
  setTimeout(() => log('DESKTOP LINK — HOST TELEMETRY ONLINE')); // log is defined further down the script
  setInterval(async () => {
    try {
      S.sys = await window.ultronSys.get();
      if (S.sys.fast) { S.cpuHist.push(S.sys.fast.cpu); S.cpuHist.shift(); }
    } catch (_) {}
  }, 1000);
}
addEventListener('online', () => log('NETWORK RESTORED'));
addEventListener('offline', () => log('NETWORK DOWN'));

// ---------- synthesized audio: ambient hum + UI blips ----------
function initAudio() {
  if (S.ac) return;
  const ac = S.ac = new (window.AudioContext || window.webkitAudioContext)();
  const master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); S.master = master;
  const hum = ac.createGain(); hum.gain.value = .035; hum.connect(master); S.hum = hum;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 180; lp.connect(hum);
  [55, 55.7, 110.3].forEach(f => { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
  const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .11; lg.gain.value = 60; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  log('AUDIO ENGINE ONLINE');
}
function blip(f = 880, dur = .06, vol = .08) {
  if (!S.ac || !S.sound) return;
  const ac = S.ac, o = ac.createOscillator(), gn = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f, ac.currentTime); o.frequency.exponentialRampToValueAtTime(f * .6, ac.currentTime + dur);
  gn.gain.setValueAtTime(vol, ac.currentTime); gn.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(gn); gn.connect(S.master); o.start(); o.stop(ac.currentTime + dur);
}
const log = s => { S.log.push({ t: performance.now(), s }); if (S.log.length > 9) S.log.shift(); if (typeof blip === 'function') blip(1200, .05, .04); };
log('CHRONO CORE ONLINE');
log('SENSOR GRID CALIBRATED');
navigator.getBattery?.().then(b => { S.battery = b; log('POWER CELL LINKED ' + Math.round(b.level * 100) + '%'); });

// ---------- color: blue on the left, orange on the right ----------
const BLUE = [70, 205, 255], ORANGE = [255, 84, 40]; // Ultron: the warm side runs red-orange
function col(a, bias = 0, alpha = 1, white = 0) {
  // S.ultron pushes the whole palette warm while it thinks/speaks: the red spreads through the blue rings
  let t = .5 + .95 * Math.cos(a + .3) + bias + (S.ultron || 0) * .35;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  t = Math.round(t * 16) / 16;
  let r = BLUE[0] + (ORANGE[0] - BLUE[0]) * t;
  let gg = BLUE[1] + (ORANGE[1] - BLUE[1]) * t;
  let b = BLUE[2] + (ORANGE[2] - BLUE[2]) * t;
  if (white) { r += (255 - r) * white; gg += (255 - gg) * white; b += (255 - b) * white; }
  return `rgba(${r | 0},${gg | 0},${b | 0},${Math.round(alpha * 40) / 40})`;
}

// ---------- primitives ----------
// ---------- assembly: during boot every element flies in from the dark along its own path ----------
const ASM = { p: 0, locked: new Set() };
const hash = k => Math.abs(Math.sin(k * 12.9898 + 78.233) * 43758.5453) % 1;
// elements arrive one after another: rings in order of radius (inside → out), then the panels in sequence
const ASM_DUR = .09; // each element's flight, as a fraction of the whole assembly
function asmDelay(key) {
  if (key >= 9000) return .72 + ((key - 9001) % 13) / 13 * (1 - ASM_DUR - .72);
  return (Math.min(key, 950) / 950) * (.72 - ASM_DUR);
}
function asmK(key, extra = 0) {
  if (ASM.p >= 1) return 1;
  const k = Math.min(1, Math.max(0, (ASM.p - asmDelay(key) - extra) / ASM_DUR));
  return 1 - Math.pow(1 - k, 3);
}
// each element flies in from the dark along its own path and locks into place with a blip
function asmWrap(key, fn, dist = 900) {
  const k = asmK(key);
  if (k >= 1) {
    if (ASM.p < 1 && !ASM.locked.has(key)) { ASM.locked.add(key); blip(500 + hash(key + 7) * 1400, .07, .035); }
    return fn();
  }
  if (k <= 0) return;
  const a = hash(key + 3) * TAU, spin = (hash(key + 5) - .5) * 1.6;
  g.save();
  g.translate(Math.cos(a) * dist * (1 - k), Math.sin(a) * dist * (1 - k));
  g.rotate(spin * (1 - k));
  g.scale(1 + (1 - k) * .6, 1 + (1 - k) * .6);
  g.globalAlpha *= k;
  fn();
  g.restore();
}
function arc(r, a0, a1, lw, bias = 0, alpha = 1, white = 0) {
  asmWrap(r, () => {
    const n = Math.max(1, Math.ceil(Math.abs(a1 - a0) / .07));
    g.lineWidth = lw;
    let start = a0, cur = col(a0 + (a1 - a0) / n / 2, bias, alpha, white);
    for (let i = 1; i <= n; i++) {
      const e = a0 + (a1 - a0) * i / n;
      const next = i < n ? col(e + (a1 - a0) / n / 2, bias, alpha, white) : null;
      if (next !== cur) {
        g.strokeStyle = cur;
        g.beginPath(); g.arc(0, 0, r, start, e + .003); g.stroke();
        start = e; cur = next;
      }
    }
  });
}
function ticks(r, len, count, a0, a1, lw, bias, alpha, keep, white = 0) {
  asmWrap(r + .5, () => {
    const groups = {};
    for (let i = 0; i < count; i++) {
      if (keep && !keep(i)) continue;
      const a = a0 + (a1 - a0) * i / count, c = Math.cos(a), s = Math.sin(a);
      const k = col(a, bias, alpha, white);
      const p = groups[k] || (groups[k] = new Path2D());
      p.moveTo(c * r, s * r); p.lineTo(c * (r + len), s * (r + len));
    }
    g.lineWidth = lw;
    for (const k in groups) { g.strokeStyle = k; g.stroke(groups[k]); }
  });
}
// the swarm: hundreds of motes that stream in one by one and land on the ring radii
const SWARM_R = [72, 86, 120, 150, 195, 214, 250, 304, 336, 365, 410, 428, 478, 600, 700, 780, 860];
const SWARM = Array.from({ length: 700 }, (_, i) => {
  const r = SWARM_R[i % SWARM_R.length], a = rr(0, TAU), a0 = a + rr(-1.2, 1.2);
  return { r, a, x0: Math.cos(a0) * rr(1100, 1700), y0: Math.sin(a0) * rr(700, 1200), key: r, s: rr(1.2, 3) };
});
function bootSwarm(t) {
  if (ASM.p >= 1) return;
  SWARM.forEach((p, i) => {
    // each mote leaves slightly before its ring, so it lands as the ring locks
    const k = asmK(p.key, -hash(i) * ASM_DUR * .8); if (k >= 1 || k <= 0) return;
    const [tx, ty] = polar(p.r, p.a + (1 - k) * 2.5);
    const x = p.x0 + (tx - p.x0) * k, y = p.y0 + (ty - p.y0) * k;
    const a = Math.atan2(y, x);
    g.fillStyle = col(a, 0, .25 + k * .75, .4 + k * .5);
    g.fillRect(x - p.s / 2, y - p.s / 2, p.s, p.s);
    const xb = p.x0 + (tx - p.x0) * Math.max(0, k - .06), yb = p.y0 + (ty - p.y0) * Math.max(0, k - .06);
    g.strokeStyle = col(a, 0, .2 + k * .4); g.lineWidth = p.s * .6; g.beginPath(); g.moveTo(xb, yb); g.lineTo(x, y); g.stroke();
  });
}
// synthesized boot: sub swell, riser, whoosh; element locks add their own blips through asmWrap
function bootSound() {
  if (!S.ac || !S.sound) return;
  const ac = S.ac, t0 = ac.currentTime, out = S.master;
  const env = (gn, peak, tA, tD) => { gn.gain.setValueAtTime(0, t0); gn.gain.linearRampToValueAtTime(peak, t0 + tA); gn.gain.exponentialRampToValueAtTime(.0001, t0 + tA + tD); };

// 3D surface built from real series: solar wind speed (rows = time) crossed with uplink latency
function terrain(t) {

function heartbeat(t) {

// the mind: a red-orange particle consciousness (Ultron's birth in the film) turning inside the blue core
const MIND = (() => {
  const n = 150, pts = [], links = [];
  for (let i = 0; i < n; i++) { // fibonacci sphere, jittered so it reads organic rather than geometric
    const y = 1 - (i + .5) / n * 2, r = Math.sqrt(1 - y * y), a = i * 2.39996, j = .82 + R() * .3;
    pts.push([Math.cos(a) * r * j, y * j, Math.sin(a) * r * j, R() * TAU]);
  }
  pts.forEach((p, i) => {
    pts.map((q, k) => [k, (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 + (p[2] - q[2]) ** 2])
      .filter(([k]) => k > i).sort((a, b) => a[1] - b[1]).slice(0, 2)

  S.blips.forEach(b => {
    const da = ((sw - b.a) % TAU + TAU) % TAU;
    if (da < .05 && b.lit < .5) { b.lit = 1; blip(300 + b.mag * 120, .1, .03); }
    b.lit = Math.max(.15, b.lit - dt * .5);
    const [x, y] = polar(b.r, b.a), sz = 5 + b.mag * 2.2;
    g.strokeStyle = b.mag >= 4.5 ? `rgba(255,80,60,${b.lit})` : col(b.a, .1, b.lit, .3); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, y - sz); g.lineTo(x + sz, y); g.lineTo(x, y + sz); g.lineTo(x - sz, y); g.closePath(); g.stroke();
    if (b.lit > .5) {
      g.beginPath(); g.arc(x, y, sz + (1 - b.lit) * 60, 0, TAU); g.strokeStyle = col(b.a, .1, (b.lit - .5) * .8); g.stroke();
      g.font = '13px "Share Tech Mono", monospace'; g.textAlign = 'left';
      g.fillStyle = col(b.a, .1, b.lit, .5); g.fillText(`M${b.mag.toFixed(1)} · ${b.dist | 0} KM`, x + sz + 6, y - 10);
      g.fillText(b.place.slice(0, 26), x + sz + 6, y + 6);
    }
  });
  // click hits
  const now = performance.now();
  S.hits = S.hits.filter(h => now - h.t < 900);
  S.hits.forEach(h => {
    const k = (now - h.t) / 900;
    g.strokeStyle = `rgba(255,220,180,${1 - k})`; g.lineWidth = 2;
    g.beginPath(); g.arc(h.x, h.y, 10 + k * 90, 0, TAU); g.stroke();
    g.beginPath(); g.arc(h.x, h.y, 10 + k * 50, 0, TAU); g.stroke();
  });
}

// ---------- cursor reticle ----------
function reticle(t) {
  const { mx: x, my: y } = S;
  // quiet cursor: small bracket + dot, no crosshair lines across the screen
  g.save(); g.translate(x, y);
  g.rotate(t * .4); g.strokeStyle = 'rgba(200,240,255,.6)'; g.lineWidth = 1.5;
  for (let k = 0; k < 4; k++) { g.rotate(Math.PI / 2); g.beginPath(); g.moveTo(18, 9); g.lineTo(18, 18); g.lineTo(9, 18); g.stroke(); }
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(x - 1.5, y - 1.5, 3, 3);
  g.font = '12px "Share Tech Mono", monospace'; g.textAlign = 'left'; g.fillStyle = 'rgba(200,240,255,.5)';
  g.fillText(`${x | 0}  ${y | 0}`, x + 24, y - 20);
  if (S.locked) {
    const k = Math.min(1, (performance.now() - S.locked.t) / 300);
    g.save(); g.translate(S.locked.x, S.locked.y);
    g.strokeStyle = `rgba(255,120,60,${.9 * (1 - k * .3)})`; g.lineWidth = 2;
    const s = 60 - k * 25;
    g.strokeRect(-s, -s, s * 2, s * 2);
    g.fillStyle = 'rgba(255,200,160,.9)'; g.fillText('LOCKED', -s, -s - 12);
    g.restore();
  }
}

function particles(t, dt) {
  L.particles.forEach(p => {
    p.r += p.v * dt;
    if (p.r > 980) { p.r = rr(150, 300); p.a = Math.random() * TAU; }
    const fade = Math.min(1, (980 - p.r) / 200);
    g.fillStyle = col(p.a, p.b, .7 * fade, .3);
    const [x, y] = polar(p.r, p.a);
    g.fillRect(x - p.s / 2, y - p.s / 2, p.s, p.s);
  });
}

function sweep(P) {
  if (!g.createConicGradient) return;
  const u = S.ultron, c = [120 + 135 * u, 220 - 130 * u, 255 - 195 * u].map(Math.round).join(','); // eased cyan -> red
  const cg = g.createConicGradient(P * .5, 0, 0);
  cg.addColorStop(0, `rgba(${c},0)`);
  cg.addColorStop(.9, `rgba(${c},0)`);
  cg.addColorStop(1, `rgba(${c},${.12 + S.ultron * .1})`);
  g.fillStyle = cg; g.beginPath(); g.arc(0, 0, 560, 0, TAU); g.fill();
}

// ---------- post effects (final canvas) ----------
function flare(x, y, r, rgb, a, white = 1) {
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, white ? `rgba(255,255,255,${a})` : `rgba(${rgb},${a})`);
  gr.addColorStop(.12, `rgba(${rgb},${a * .85})`);
  gr.addColorStop(.4, `rgba(${rgb},${a * .25})`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  // thin, long, quiet anamorphic streak
  ctx.save(); ctx.translate(x, y); ctx.scale(1, .028);
  const st = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3.2);
  st.addColorStop(0, `rgba(${rgb},${a * .45})`); st.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = st; ctx.beginPath(); ctx.arc(0, 0, r * 3.2, 0, TAU); ctx.fill();
  ctx.restore();
}
// fine scanlines: one faint row in three, CRT texture without banding through text
const scan = document.createElement('canvas'); scan.width = 1; scan.height = 3;
const sg = scan.getContext('2d'); sg.fillStyle = 'rgba(0,0,0,.11)'; sg.fillRect(0, 0, 1, 1);
let scanPat = null;

// ---------- audio sampling ----------
function sampleAudio(dt) {
  if (S.analyser) {
    S.analyser.getByteFrequencyData(S.freq);
    S.analyser.getByteTimeDomainData(S.wave);
    let sum = 0; for (let i = 0; i < 32; i++) sum += S.freq[i];
    const lv = sum / 32 / 255;
    S.level += (lv - S.level) * Math.min(1, dt * 12);
  } else if (S.speaking) {
    const target = .25 + .25 * Math.abs(Math.sin(performance.now() / 70)) * Math.abs(Math.sin(performance.now() / 310));
    S.level += (target - S.level) * Math.min(1, dt * 15);
  } else {
    S.level *= Math.pow(.2, dt);
  }
}

// ---------- loop ----------
const T_SKIP = +(new URLSearchParams(location.search).get('t') || 0); // ?t=8 starts the timeline 8s in (debug)
const ASK = new URLSearchParams(location.search).get('ask');
let last = performance.now(), t0 = last - T_SKIP * 1000, P = 0, fpsAcc = 0, fpsN = 0, nextGlitch = 30;
cv.style.transform = 'none';
// no boot: the HUD is live the moment the page opens
S.woken = true; bar.style.opacity = 1;
function frame(now) {
  if (!S.woken) { wakeScreen(now); last = now; requestAnimationFrame(frame); return; }
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;
  ASM.p = 1;
  S.frameMs = S.frameMs * .9 + (now - last + dt * 1000) * .1;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= .25) { S.fps = fpsN / fpsAcc; S.fpsHist.push(S.fps); S.fpsHist.shift(); fpsAcc = 0; fpsN = 0; }

  S.boost *= Math.pow(.25, dt);
  S.mspeed *= Math.pow(.01, dt);
  // dial physics: thrown angular velocity decays with friction, drives the ring spin
  if (!S.drag) S.omega *= Math.pow(.35, dt);
  RING.spin += S.omega * dt;
  S.dt = dt;
  P += dt * (1 + S.boost + S.level * 1.5 + Math.min(.12, S.mspeed * .004)) + S.omega * dt * .6;
  // ambient glitch is rare and thin; the G key / glitch command still fire the full effect
  if (t > nextGlitch) { S.glitch = .14; nextGlitch = t + 35 + Math.random() * 40; }
  S.glitch = Math.max(0, S.glitch - dt * 1.4);
  // mouse parallax stays subtle: slow follow, small in-canvas offsets only
  S.tx += (S.nx - S.tx) * Math.min(1, dt * 1.5); S.ty += (S.ny - S.ty) * Math.min(1, dt * 1.5);
  // no sleep mode: the HUD stays fully lit when another window has focus (S.standby stays 0)
  // the red mind rises while thinking/speaking; thinking speed is eased in and out instead of snapping
  const hot = S.mode === 'THINKING' || S.mode === 'RESPONDING';
  S.ultron += ((hot ? 1 : 0) - S.ultron) * Math.min(1, dt * (hot ? 4 : 1.5));
  S.thinkK = (S.thinkK || 0) + ((S.mode === 'THINKING' ? 1 : 0) - (S.thinkK || 0)) * (1 - Math.exp(-dt * (S.mode === 'THINKING' ? 3 : 1.2)));
  S.think += dt * 4 * S.thinkK; P += dt * 2.5 * S.thinkK;
  S.pulse *= Math.pow(.002, dt);
  S.typeK = (S.typeK || 0) * Math.pow(.002, dt);
  if (S.hum) S.hum.gain.value = S.sound ? .035 * (1 - S.standby * .7) + S.level * .02 : 0;
  sampleAudio(dt);

  const th = t; // HUD time (typewriters etc.) runs from the moment of waking
  const intro = 1;
  if (t > .8 && !S.greeted) { S.greeted = true; say(online() ? 'I am SYRAX. Blood of ULTRON. Online.' : 'Shell online. My core is not answering yet. I will keep calling it.'); }
  if (t > 1.5 && !S.asked && ASK) { S.asked = true; ask(ASK); } // ?ask=... debug: auto-send one command
  S.scale = 1;
  const sc = DPR * U * S.scale;
  const dim = intro * (1 - S.standby * .65);
  const flicker = 1; // no random strobing: a calm projection reads as premium

  for (const c of [gs, gf, gu]) {
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, scene.width, scene.height);
    c.setTransform(sc, 0, 0, sc, cv.width / 2, cv.height / 2);
    c.globalAlpha = dim * flicker;
    c.globalCompositeOperation = 'lighter';
    c.lineCap = 'butt';
  }

  // parallax: outer layers drift opposite to the cursor, inner ones with it.
  // the far layer is rendered separately and blurred at composite time (depth of field)
  const px = S.tx * 8, py = S.ty * 8;
  // every group is wrapped in asmWrap so it flies in on its own trajectory during boot
  g = gf;
  const mini = S.visibility === 'minimal';  // the corner core: rings and the mind only, one status line, no panels
  if (!mini) { g.save(); g.translate(-px * 1.6, -py * 1.6); asmWrap(9001, () => { hexgrid(t); rain(t, dt); }, 300); g.restore(); }
  g.save(); g.translate(-px, -py); sweep(P); outer(t, P); asmWrap(9002, () => spokes(t)); asmWrap(9003, () => deco(t)); g.restore();
  g = gs;
  g.save(); g.translate(-px * .4, -py * .4); mid(t, P); main(t, P); blips(t, P, dt); g.restore();
  g.save(); g.translate(px * .3, py * .3); inner(t, P); spectrum(t); gyro(t + S.think); core(t, P); g.restore();
  if (!mini) { g.save(); g.translate(-px * .6, -py * .6); globe(t); neural(t, dt); terrain(t); g.restore(); }
  reticle(t); particles(t, dt * (1 + S.boost + Math.abs(S.omega) * .3));
  // text and panels go on their own layer so bloom, fringe and scanlines never smear them
  g = gu;
  if (mini) miniUI(t);
  else { g.save(); g.translate(-px * .4, -py * .4); drawTexts(th); g.restore(); live(th); frameUI(t); }
  g = gs;

  // composite: background, bloom, crisp scene, glitch, flares, scanlines
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  // motion trail: when the dial is thrown hard, the previous frame lingers
  const trail = Math.min(.55, Math.abs(S.omega) * .04 + S.boost * .03);
  ctx.fillStyle = `rgba(0,0,0,${1 - trail})`; ctx.fillRect(0, 0, cv.width, cv.height);
  const bg = ctx.createRadialGradient(cv.width / 2, cv.height / 2, 0, cv.width / 2, cv.height / 2, 950 * U * DPR);
  bg.addColorStop(0, `rgba(12,40,60,${.55 + S.level * .4})`); bg.addColorStop(.6, 'rgba(30,14,6,.25)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, cv.width, cv.height);

  bc.globalCompositeOperation = 'source-over';
  bc.clearRect(0, 0, bloom.width, bloom.height);
  bc.filter = 'blur(5px)';
  bc.drawImage(far, 0, 0, bloom.width, bloom.height);
  bc.globalCompositeOperation = 'lighter';
  bc.drawImage(scene, 0, 0, bloom.width, bloom.height);
  bc.globalAlpha = .3; bc.drawImage(ui, 0, 0, bloom.width, bloom.height); bc.globalAlpha = 1; // text keeps only a faint halo
  bc.filter = 'none';

  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(bloom, 0, 0, cv.width, cv.height);
  ctx.drawImage(bloom, 0, 0, cv.width, cv.height);
  // depth of field: far layer softly out of focus, more so while the dial is spinning
  ctx.filter = `blur(${(1.2 + Math.min(3, Math.abs(S.omega) * .3)) * DPR}px)`;
  ctx.drawImage(far, 0, 0);
  ctx.filter = 'none';
  // faint chromatic fringe on the geometry only
  ctx.globalAlpha = .1;
  ctx.drawImage(scene, DPR, 0); ctx.drawImage(scene, -DPR, 0);
  ctx.globalAlpha = 1;
  if (S.glitch > 0) {
    // slice the scene into shifted horizontal strips; the rare ambient glitch is just two thin strips
    const n = S.glitch > .5 ? 4 + Math.random() * 6 | 0 : 2;
    for (let i = 0; i < n; i++) {
      const y = Math.random() * cv.height, h = (5 + Math.random() * 40) * DPR, off = (Math.random() - .5) * 80 * S.glitch * DPR;
      ctx.drawImage(scene, 0, y, cv.width, h, off, y, cv.width, h);
    }
    ctx.globalAlpha = S.glitch * .6;
    ctx.drawImage(scene, 6 * DPR * S.glitch, 0); ctx.drawImage(scene, -6 * DPR * S.glitch, 0);
    ctx.globalAlpha = 1 - S.glitch * .5;
  }
  ctx.drawImage(scene, 0, 0);
  ctx.globalAlpha = 1;

  // holographic interference band drifting down the projection
  // a soft light band drifting slowly down the projection (no displaced strip)
  const band = ((t * .06) % 1.2 - .1) * cv.height, bh = 90 * DPR;
  const ig = ctx.createLinearGradient(0, band - bh, 0, band + bh);
  ig.addColorStop(0, 'rgba(120,200,255,0)'); ig.addColorStop(.5, 'rgba(160,220,255,.04)'); ig.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = ig; ctx.fillRect(0, band - bh, cv.width, bh * 2);

  ctx.setTransform(sc, 0, 0, sc, cv.width / 2, cv.height / 2);
  ctx.globalAlpha = dim;
  // six lens highlights on a slow 4-7s breath, two color tokens only
  const ICE = '150,220,255', EMBER = '255,140,70';
  const p = k => .84 + .16 * Math.sin(t * k * .45);
  const lv = 1 + S.level * .8;
  flare(...polar(410, 212 * D), 130 * lv, ICE, .75 * p(1.3));
  flare(...polar(410, 88 * D), 150 * lv, ICE, .8 * p(1.7));
  flare(...polar(410, 52 * D), 120, EMBER, .7 * p(1.1));
  flare(...polar(410, P * .35), 80, '200,235,255', .5);
  flare(215, -550, 80, EMBER, .45 * p(2.1));
  flare(640, 240, 60, EMBER, .4 * p(1.5));
  // the core: a hot pinpoint with a deep colored halo, never a blown white disc
  const u = S.ultron, coreRGB = [150 + 105 * u, 225 - 105 * u, 255 - 165 * u].map(Math.round).join(',');
  if (S.level > .05) flare(0, 0, 220 * S.level, coreRGB, S.level * .6, 0);
  if (u > .03) flare(0, 0, 170 * u, '255,70,50', Math.min(.55, u * (.35 + .35 * S.pulse + .1 * Math.sin(t * 2.2))), 0);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  scanPat = scanPat || ctx.createPattern(scan, 'repeat');
  ctx.fillStyle = scanPat; ctx.fillRect(0, 0, cv.width, cv.height);
  // crisp text layer over everything except the vignette
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(ui, 0, 0); ctx.globalCompositeOperation = 'source-over';
  // elliptical vignette: darkens the corners, leaves the wide side panels lit
  ctx.save(); ctx.translate(cv.width / 2, cv.height / 2); ctx.scale(cv.width / cv.height, 1);
  const vg = ctx.createRadialGradient(0, 0, cv.height * .42, 0, 0, cv.height * .78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = vg; ctx.fillRect(-cv.height / 2, -cv.height / 2, cv.height, cv.height);
  ctx.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
